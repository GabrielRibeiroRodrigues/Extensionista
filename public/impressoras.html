<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impressoras · Frangonete</title>
  <link rel="icon" href="/icone.svg">
  <link rel="stylesheet" href="/marca.css">
  <link rel="stylesheet" href="/impressoras.css">
  <link rel="stylesheet" href="/sessao.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a class="logo" href="/"><img src="/mascote.svg" alt=""><span class="marca-nome">Frangonete</span></a>
      <div class="topo-acoes"><div id="sessao"></div></div>
    </div>
  </header>

  <div class="cabeca">
    <div>
      <a class="voltar" id="voltar" href="/painel.html" hidden>Voltar ao painel</a>
      <h1>Impressoras das cozinhas</h1>
      <p>Cada pedido sai aqui exatamente como na impressora térmica da cozinha.</p>
    </div>
    <div class="cabeca-acoes">
      <span id="conexao" class="conexao off">desconectado</span>
      <button id="som" class="adesivo botao" style="background:var(--papel)" aria-pressed="false">Ligar som</button>
    </div>
  </div>

  <main id="impressoras" class="impressoras"></main>

  <template id="tpl-impressora">
    <section class="impressora">
      <div class="corpo">
        <div class="corpo-topo">
          <div>
            <div class="modelo">TÉRMICA 80mm</div>
            <h2 class="nome"></h2>
          </div>
          <div class="led-area">
            <span class="led"></span>
            <span class="led-texto"></span>
          </div>
        </div>
        <div class="corpo-meio">
          <div class="destino"></div>
          <div class="contador"><b>0</b> impressos</div>
        </div>
        <div class="corpo-acoes">
          <button class="botao teste">Imprimir teste</button>
        </div>
        <div class="saida"></div>
      </div>
      <div class="erro-impressora" hidden></div>
      <div class="bandeja">
        <div class="papel vazio"><div class="conteudo"><div class="aguardando">Aguardando pedidos…</div></div></div>
      </div>
      <h3 class="titulo-historico">Histórico</h3>
      <ol class="historico"></ol>
    </section>
  </template>

  <script src="/sessao.js"></script>
  <script src="/impressoras.js"></script>
</body>
</html>
