<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozinha</title>
  <link rel="icon" href="/icone.svg">
  <link rel="stylesheet" href="/cozinha.css">
</head>
<body>
  <header class="topo">
    <div class="titulo">
      <h1 id="nome-cozinha">Cozinha</h1>
      <span id="conexao" class="conexao off" title="Conexão com o servidor">desconectado</span>
    </div>
    <div class="contadores">
      <span class="contador novo"><b id="n-novo">0</b> na fila</span>
      <span class="contador preparo"><b id="n-preparo">0</b> em preparo</span>
      <span class="contador atrasado"><b id="n-atrasado">0</b> atrasados</span>
    </div>
    <div class="acoes">
      <label class="interruptor" title="Abre a impressão do navegador a cada pedido novo (use com impressora USB neste computador)">
        <input type="checkbox" id="imprimir-local"> Imprimir neste PC
      </label>
      <a class="link" href="/impressoras.html" target="_blank">Impressoras</a>
      <a id="trocar" class="link" href="#"></a>
      <button id="tela-cheia" class="link botao-link" title="Tela cheia">⛶</button>
      <time id="relogio"></time>
    </div>
  </header>

  <main id="tickets" class="tickets"></main>

  <footer class="prontos">
    <span class="rotulo">Prontos</span>
    <div id="lista-prontos"></div>
  </footer>

  <div id="cancelado" class="cancelado" role="alert" hidden>
    <div>
      <strong id="cancelado-titulo"></strong>
      <span id="cancelado-texto"></span>
    </div>
    <button id="fechar-cancelado" aria-label="Fechar">OK</button>
  </div>

  <div id="ativar" class="ativar">
    <button id="botao-ativar">
      <small id="ativar-loja"></small>
      <strong id="ativar-titulo">Cozinha</strong>
      <span>Toque para abrir a tela e ativar o som de novos pedidos</span>
    </button>
  </div>

  <div id="area-impressao" class="area-impressao" aria-hidden="true"></div>

  <script src="/cozinha.js"></script>
</body>
</html>
